<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل مدیریت آدور</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f6f3f1;
      color: #292929;
    }

    .container {
      width: min(100% - 24px, 900px);
      margin: auto;
    }

    header {
      background: linear-gradient(135deg, #5c234b, #8d426d);
      color: white;
      padding: 30px 0;
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: .9;
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    button,
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    .btn-primary {
      background: #6d2b58;
      color: white;
    }

    .btn-light {
      background: white;
      color: #6d2b58;
      border: 1px solid #ddd;
    }

    .btn-danger {
      background: #b83b4b;
      color: white;
    }

    .btn-green {
      background: #237a5b;
      color: white;
    }

    .product-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.07);
      border: 1px solid #eee;
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .product-number {
      font-weight: bold;
      color: #6d2b58;
      font-size: 18px;
    }

    .product-preview {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
      padding: 12px;
      background: #faf8f7;
      border-radius: 14px;
    }

    .product-preview img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: #eee;
    }

    .image-actions {
      flex: 1;
    }

    .image-actions strong {
      display: block;
      margin-bottom: 8px;
    }

    .image-actions small {
      display: block;
      color: #777;
      line-height: 1.8;
      margin-top: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      background: white;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #8d426d;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #555;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .bottom-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .save-all {
      position: sticky;
      bottom: 12px;
      background: rgba(255,255,255,.95);
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,.15);
      margin-bottom: 20px;
      z-index: 20;
    }

    .save-all button {
      width: 100%;
      font-size: 16px;
      padding: 15px;
    }

    .message {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 20px;
      background: #237a5b;
      color: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      transform: translateY(120px);
      transition: .3s;
      z-index: 100;
      box-shadow: 0 5px 25px rgba(0,0,0,.2);
    }

    .message.show {
      transform: translateY(0);
    }

    .empty {
      text-align: center;
      background: white;
      border-radius: 15px;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 600px) {
      .two {
        grid-template-columns: 1fr;
      }

      .product-preview {
        align-items: flex-start;
      }

      .product-preview img {
        width: 90px;
        height: 90px;
      }

      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <h1>پنل مدیریت آدور</h1>
      <p>ویرایش عکس، نام، برند، قیمت و توضیحات محصولات</p>
    </div>
  </header>

  <main class="container">

    <div class="top-actions">
      <button class="btn btn-light" onclick="goToSite()">
        مشاهده سایت
      </button>

      <button class="btn btn-green" onclick="saveAll()">
        ذخیره همه تغییرات
      </button>

      <button class="btn btn-danger" onclick="resetAll()">
        بازگردانی اطلاعات اولیه
      </button>
    </div>

    <div id="productsContainer"></div>

    <div class="save-all">
      <button class="btn btn-primary" onclick="saveAll()">
        💾 ذخیره همه تغییرات
      </button>
    </div>

  </main>

  <div class="message" id="message"></div>

  <script>

    /*
      ============================================================
      اطلاعات اولیه محصولات آدور
      ============================================================
    */

    const defaultProducts = [
      {
        id: 1,
        brand: "LANCOME",
        title: "Advanced Génifique Youth Activating Serum",
        category: "skin",
        categoryLabel: "مراقبت پوست",
        description: "سرم محبوب برای روتین مراقبت و ایجاد ظاهری شاداب‌تر و جوان‌تر.",
        price: 4850000,
        badge: "پرفروش",
        image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=800&q=90"
      },

      {
        id: 2,
        brand: "LA ROCHE-POSAY",
        title: "Toleriane Hydrating Care",
        category: "skin",
        categoryLabel: "مراقبت پوست",
        description: "انتخابی مناسب برای روتین آبرسانی و مراقبت روزانه پوست.",
        price: 2650000,
        badge: "محبوب",
        image: "https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&w=800&q=90"
      },

      {
        id: 3,
        brand: "KÉRASTASE",
        title: "Nutritive Hair Care",
        category: "hair",
        categoryLabel: "مراقبت مو",
        description: "مراقبت تغذیه‌ای برای موهای خشک و نیازمند لطافت بیشتر.",
        price: 3950000,
        badge: "منتخب",
        image: "https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?auto=format&fit=crop&w=800&q=90"
      },

      {
        id: 4,
        brand: "CHANEL",
        title: "Allure Eau de Parfum",
        category: "perfume",
        categoryLabel: "عطر",
        description: "رایحه‌ای شیک و ماندگار برای کسانی که انتخاب کلاسیک را می‌پسندند.",
        price: 12800000,
        badge: "لوکس",
        image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=800&q=90"
      },

      {
        id: 5,
        brand: "DIOR",
        title: "Capture Youth Skin Care",
        category: "skin",
        categoryLabel: "جوانساز",
        description: "محصولی لوکس برای تکمیل روتین مراقبت و جوانسازی پوست.",
        price: 6900000,
        badge: "جدید",
        image: "https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd?auto=format&fit=crop&w=800&q=90"
      },

      {
        id: 6,
        brand: "LANCOME",
        title: "Rénergie Multi-Lift Cream",
        category: "skin",
        categoryLabel: "جوانساز",
        description: "کرم مراقبتی لوکس برای پوست‌های بالغ و روتین ضدچروک.",
        price: 7250000,
        badge: "منتخب آدور",
        image: "https://images.unsplash.com/photo-1556228578-5b2b3b1b1a1d?auto=format&fit=crop&w=800&q=90"
      },

      {
        id: 7,
        brand: "OLAPLEX",
        title: "Bond Maintenance Hair Care",
        category: "hair",
        categoryLabel: "مراقبت مو",
        description: "برای مراقبت از موهایی که در اثر رنگ و حرارت نیازمند توجه بیشتر هستند.",
        price: 3200000,
        badge: "محبوب",
        image: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=90"
      },

      {
        id: 8,
        brand: "YSL",
        title: "Libre Eau de Parfum",
        category: "perfume",
        categoryLabel: "عطر",
        description: "رایحه‌ای مدرن و جذاب برای استفاده روزمره و موقعیت‌های خاص.",
        price: 9800000,
        badge: "پرفروش",
        image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=800&q=90"
      }
    ];


    /*
      ============================================================
      دریافت اطلاعات ذخیره‌شده
      ============================================================
    */

    let products = JSON.parse(
      localStorage.getItem("adorProducts")
    ) || JSON.parse(JSON.stringify(defaultProducts));


    /*
      ============================================================
      نمایش محصولات
      ============================================================
    */

    function renderProducts() {

      const container = document.getElementById("productsContainer");

      if (!products.length) {
        container.innerHTML = `
          <div class="empty">
            محصولی وجود ندارد.
          </div>
        `;
        return;
      }

      container.innerHTML = products.map((product, index) => `

        <div class="product-card">

          <div class="product-header">

            <div class="product-number">
              محصول ${index + 1}
            </div>

          </div>


          <div class="product-preview">

            <img
              id="preview-${product.id}"
              src="${product.image}"
              alt="${product.title}"
            >

            <div class="image-actions">

              <strong>
                عکس محصول
              </strong>

              <input
                type="file"
                accept="image/*"
                onchange="changeImage(event, ${product.id})"
              >

              <small>
                از گالری گوشی یک عکس انتخاب کنید.
              </small>

            </div>

          </div>


          <div class="two">

            <div class="field">

              <label>
                برند
              </label>

              <input
                id="brand-${product.id}"
                type="text"
                value="${escapeHtml(product.brand)}"
              >

            </div>


            <div class="field">

              <label>
                نام محصول
              </label>

              <input
                id="title-${product.id}"
                type="text"
                value="${escapeHtml(product.title)}"
              >

            </div>

          </div>


          <div class="two">

            <div class="field">

              <label>
                قیمت به تومان
              </label>

              <input
                id="price-${product.id}"
                type="number"
                value="${product.price}"
              >

            </div>


            <div class="field">

              <label>
                برچسب محصول
              </label>

              <input
                id="badge-${product.id}"
                type="text"
                value="${escapeHtml(product.badge)}"
              >

            </div>

          </div>


          <div class="field">

            <label>
              توضیحات محصول
            </label>

            <textarea
              id="description-${product.id}"
            >${escapeHtml(product.description)}</textarea>

          </div>


          <div class="bottom-actions">

            <button
              class="btn btn-primary"
              onclick="saveProduct(${product.id})"
            >
              💾 ذخیره این محصول
            </button>

          </div>

        </div>

      `).join("");
    }


    /*
      ============================================================
      تغییر عکس
      ============================================================
    */

    function changeImage(event, id) {

      const file = event.target.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showMessage("لطفاً یک فایل تصویری انتخاب کنید.");
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {

        const product = products.find(p => p.id === id);

        if (!product) return;

        product.image = e.target.result;

        const preview = document.getElementById("preview-" + id);

        if (preview) {
          preview.src = product.image;
        }

        showMessage("عکس محصول تغییر کرد. برای ثبت نهایی ذخیره را بزنید.");
      };

      reader.readAsDataURL(file);
    }


    /*
      ============================================================
      ذخیره یک محصول
      ============================================================
    */

    function saveProduct(id) {

      const product = products.find(p => p.id === id);

      if (!product) return;


      product.brand =
        document.getElementById("brand-" + id).value.trim();


      product.title =
        document.getElementById("title-" + id).value.trim();


      product.price =
        Number(document.getElementById("price-" + id).value) || 0;


      product.badge =
        document.getElementById("badge-" + id).value.trim();


      product.description =
        document.getElementById("description-" + id).value.trim();


      localStorage.setItem(
        "adorProducts",
        JSON.stringify(products)
      );


      showMessage("محصول با موفقیت ذخیره شد.");
    }


    /*
      ============================================================
      ذخیره همه محصولات
      ============================================================
    */

    function saveAll() {

      products.forEach(product => {

        const brand = document.getElementById("brand-" + product.id);
        const title = document.getElementById("title-" + product.id);
        const price = document.getElementById("price-" + product.id);
        const badge = document.getElementById("badge-" + product.id);
        const description = document.getElementById("description-" + product.id);

        if (brand) product.brand = brand.value.trim();
        if (title) product.title = title.value.trim();
        if (price) product.price = Number(price.value) || 0;
        if (badge) product.badge = badge.value.trim();
        if (description) product.description = description.value.trim();

      });


      localStorage.setItem(
        "adorProducts",
        JSON.stringify(products)
      );


      showMessage("تمام تغییرات با موفقیت ذخیره شد.");
    }


    /*
      ============================================================
      بازگردانی اطلاعات اولیه
      ============================================================
    */

    function resetAll() {

      const ok = confirm(
        "آیا مطمئن هستید؟ تمام تغییرات ذخیره‌شده حذف می‌شود."
      );

      if (!ok) return;

      localStorage.removeItem("adorProducts");

      products = JSON.parse(
        JSON.stringify(defaultProducts)
      );

      renderProducts();

      showMessage("اطلاعات اولیه بازگردانی شد.");
    }


    /*
      ============================================================
      رفتن به سایت
      ============================================================
    */

    function goToSite() {

      window.location.href = "index.html";

    }


    /*
      ============================================================
      پیام
      ============================================================
    */

    function showMessage(text) {

      const message = document.getElementById("message");

      message.textContent = text;

      message.classList.add("show");

      setTimeout(() => {
        message.classList.remove("show");
      }, 2500);
    }


    /*
      ============================================================
      جلوگیری از مشکل HTML
      ============================================================
    */

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      ============================================================
      شروع پنل
      ============================================================
    */

    renderProducts();

  </script>

</body>
</html>
