<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل مدیریت آدور</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f6f3f2;
      color: #382632;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .header {
      background: linear-gradient(135deg, #67264f, #80365f);
      color: white;
      padding: 45px 20px 35px;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: auto;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 2.2rem;
    }

    .header p {
      margin: 0;
      opacity: .9;
      font-size: 1rem;
    }

    .top-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    button,
    .btn {
      border: 0;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: #67264f;
      color: white;
    }

    .btn-success {
      background: #3d8065;
      color: white;
    }

    .btn-danger {
      background: #b74652;
      color: white;
    }

    .btn-light {
      background: white;
      color: #67264f;
      border: 1px solid #ddd;
    }

    .products-count {
      background: white;
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
      font-weight: bold;
    }

    .product-card {
      background: white;
      border-radius: 25px;
      padding: 22px;
      margin-bottom: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    .product-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .product-head h2 {
      margin: 0;
      color: #67264f;
      font-size: 1.4rem;
    }

    .product-number {
      background: #f2e7ee;
      color: #67264f;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 13px;
    }

    .image-section {
      background: #faf8f7;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 22px;
    }

    .image-preview {
      width: 150px;
      height: 150px;
      border-radius: 18px;
      object-fit: cover;
      display: block;
      margin: 0 auto 15px;
      background: #eee;
      border: 1px solid #ddd;
    }

    .no-image {
      width: 150px;
      height: 150px;
      border-radius: 18px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      color: #888;
      text-align: center;
      padding: 10px;
    }

    .file-label {
      display: block;
      text-align: center;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
    }

    .file-label input {
      display: none;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #5b4351;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 13px;
      padding: 13px 14px;
      font-size: 15px;
      background: white;
      outline: none;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #8b4771;
      box-shadow: 0 0 0 3px rgba(139,71,113,.08);
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .product-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }

    .empty {
      background: white;
      padding: 40px 20px;
      border-radius: 20px;
      text-align: center;
      color: #777;
    }

    .save-bar {
      position: sticky;
      bottom: 15px;
      z-index: 20;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(10px);
      padding: 12px;
      border-radius: 18px;
      box-shadow: 0 5px 30px rgba(0,0,0,.15);
      margin-top: 25px;
    }

    .save-bar button {
      width: 100%;
      font-size: 17px;
      padding: 17px;
    }

    .message {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 25px;
      z-index: 100;
      background: #3d8065;
      color: white;
      padding: 15px 20px;
      border-radius: 14px;
      text-align: center;
      transform: translateY(150px);
      transition: .3s;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .message.show {
      transform: translateY(0);
    }

    @media (max-width: 700px) {

      .header h1 {
        font-size: 1.8rem;
      }

      .two-columns {
        grid-template-columns: 1fr;
      }

      .product-head {
        align-items: flex-start;
      }

      .product-card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container">
      <h1>پنل مدیریت آدور</h1>
      <p>ویرایش و مدیریت محصولات، قیمت، برند، عکس و توضیحات</p>

      <div class="top-actions">

        <button class="btn btn-success" onclick="addProduct()">
          ＋ افزودن محصول جدید
        </button>

        <a class="btn btn-light" href="index.html">
          مشاهده سایت
        </a>

        <button class="btn btn-danger" onclick="resetProducts()">
          بازگردانی اطلاعات اولیه
        </button>

      </div>
    </div>
  </header>


  <main class="container" style="padding:25px 0 60px;">

    <div class="products-count" id="productsCount">
      تعداد محصولات: ۰
    </div>

    <div id="productsContainer"></div>

    <div class="save-bar">
      <button class="btn btn-primary" onclick="saveProducts()">
        💾 ذخیره همه تغییرات
      </button>
    </div>

  </main>


  <div class="message" id="message"></div>


<script>

  /*
   ============================================================
   اطلاعات اولیه محصولات
   ============================================================
  */

  const defaultProducts = [

    {
      id: 1,
      brand: "LANCOME",
      title: "Advanced Génifique Youth Activating Serum",
      category: "skin",
      categoryLabel: "مراقبت پوست",
      description: "سرم محبوب برای روتین مراقبت و ایجاد ظاهری شاداب‌تر و جوان‌تر.",
      price: 4850000,
      badge: "پرفروش",
      image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=800&q=90"
    },

    {
      id: 2,
      brand: "LA ROCHE-POSAY",
      title: "Toleriane Hydrating Care",
      category: "skin",
      categoryLabel: "مراقبت پوست",
      description: "انتخابی مناسب برای روتین آبرسانی و مراقبت روزانه پوست.",
      price: 2650000,
      badge: "محبوب",
      image: "https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?auto=format&fit=crop&w=800&q=90"
    },

    {
      id: 3,
      brand: "KÉRASTASE",
      title: "Nutritive Hair Care",
      category: "hair",
      categoryLabel: "مراقبت مو",
      description: "مراقبت تغذیه‌ای برای موهای خشک و نیازمند لطافت بیشتر.",
      price: 3950000,
      badge: "منتخب",
      image: "https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?auto=format&fit=crop&w=800&q=90"
    },

    {
      id: 4,
      brand: "CHANEL",
      title: "Allure Eau de Parfum",
      category: "perfume",
      categoryLabel: "عطر",
      description: "رایحه‌ای شیک و ماندگار برای کسانی که انتخاب کلاسیک را می‌پسندند.",
      price: 12800000,
      badge: "لوکس",
      image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=800&q=90"
    },

    {
      id: 5,
      brand: "DIOR",
      title: "Capture Youth Skin Care",
      category: "skin",
      categoryLabel: "جوانساز",
      description: "محصولی لوکس برای تکمیل روتین مراقبت و جوانسازی پوست.",
      price: 6900000,
      badge: "جدید",
      image: "https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd?auto=format&fit=crop&w=800&q=90"
    },

    {
      id: 6,
      brand: "LANCOME",
      title: "Rénergie Multi-Lift Cream",
      category: "skin",
      categoryLabel: "جوانساز",
      description: "کرم مراقبتی لوکس برای پوست‌های بالغ و روتین ضدچروک.",
      price: 7250000,
      badge: "منتخب آدور",
      image: "https://images.unsplash.com/photo-1556228578-5b2b3b1b1a1d?auto=format&fit=crop&w=800&q=90"
    },

    {
      id: 7,
      brand: "OLAPLEX",
      title: "Bond Maintenance Hair Care",
      category: "hair",
      categoryLabel: "مراقبت مو",
      description: "برای مراقبت از موهایی که در اثر رنگ و حرارت نیازمند توجه بیشتر هستند.",
      price: 3200000,
      badge: "محبوب",
      image: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=90"
    },

    {
      id: 8,
      brand: "YSL",
      title: "Libre Eau de Parfum",
      category: "perfume",
      categoryLabel: "عطر",
      description: "رایحه‌ای مدرن و جذاب برای استفاده روزمره و موقعیت‌های خاص.",
      price: 9800000,
      badge: "پرفروش",
      image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=800&q=90"
    }

  ];


  /*
   ============================================================
   بارگذاری محصولات
   ============================================================
  */

  let products = [];

  function loadProducts() {

    const saved = localStorage.getItem("ador_products");

    if (saved) {

      try {
        products = JSON.parse(saved);

      } catch (error) {

        products = JSON.parse(JSON.stringify(defaultProducts));

      }

    } else {

      products = JSON.parse(JSON.stringify(defaultProducts));

    }

    renderProducts();
  }


  /*
   ============================================================
   نمایش محصولات
   ============================================================
  */

  function renderProducts() {

    const container = document.getElementById("productsContainer");

    document.getElementById("productsCount").textContent =
      "تعداد محصولات: " +
      new Intl.NumberFormat("fa-IR").format(products.length);


    if (!products.length) {

      container.innerHTML = `
        <div class="empty">
          هنوز محصولی وجود ندارد.
          <br><br>
          روی «افزودن محصول جدید» بزنید.
        </div>
      `;

      return;
    }


    container.innerHTML = products.map((product, index) => {

      const image = product.image || "";

      return `

        <section class="product-card">

          <div class="product-head">

            <h2>
              ${escapeHtml(product.title || "محصول جدید")}
            </h2>

            <span class="product-number">
              محصول ${index + 1}
            </span>

          </div>


          <div class="image-section">

            ${
              image
              ?
              `<img
                id="preview-${product.id}"
                class="image-preview"
                src="${escapeAttribute(image)}"
                alt="تصویر محصول"
              >`
              :
              `<div
                id="preview-${product.id}"
                class="no-image">
                هنوز عکسی انتخاب نشده
              </div>`
            }


            <label class="file-label">

              🖼️ انتخاب عکس از گوشی

              <input
                type="file"
                accept="image/*"
                onchange="changeImage(event, ${product.id})"
              >

            </label>

          </div>


          <div class="two-columns">

            <div class="field">

              <label>برند</label>

              <input
                type="text"
                value="${escapeAttribute(product.brand || "")}"
                oninput="updateProduct(${product.id}, 'brand', this.value)"
                placeholder="مثلاً DIOR"
              >

            </div>


            <div class="field">

              <label>نام محصول</label>

              <input
                type="text"
                value="${escapeAttribute(product.title || "")}"
                oninput="updateProduct(${product.id}, 'title', this.value)"
                placeholder="نام محصول"
              >

            </div>

          </div>


          <div class="two-columns">

            <div class="field">

              <label>قیمت به تومان</label>

              <input
                type="number"
                value="${Number(product.price) || 0}"
                oninput="updateProduct(${product.id}, 'price', Number(this.value))"
                placeholder="مثلاً 5000000"
              >

            </div>


            <div class="field">

              <label>برچسب محصول</label>

              <input
                type="text"
                value="${escapeAttribute(product.badge || "")}"
                oninput="updateProduct(${product.id}, 'badge', this.value)"
                placeholder="مثلاً جدید"
              >

            </div>

          </div>


          <div class="two-columns">

            <div class="field">

              <label>دسته‌بندی</label>

              <select
                onchange="updateCategory(${product.id}, this.value)"
              >

                <option
                  value="skin"
                  ${product.category === "skin" ? "selected" : ""}>
                  مراقبت پوست
                </option>

                <option
                  value="hair"
                  ${product.category === "hair" ? "selected" : ""}>
                  مراقبت مو
                </option>

                <option
                  value="perfume"
                  ${product.category === "perfume" ? "selected" : ""}>
                  عطر
                </option>

                <option
                  value="beauty"
                  ${product.category === "beauty" ? "selected" : ""}>
                  آرایشی و بهداشتی
                </option>

                <option
                  value="antiaging"
                  ${product.category === "antiaging" ? "selected" : ""}>
                  جوانساز
                </option>

              </select>

            </div>


            <div class="field">

              <label>عنوان دسته‌بندی</label>

              <input
                type="text"
                value="${escapeAttribute(product.categoryLabel || "")}"
                oninput="updateProduct(${product.id}, 'categoryLabel', this.value)"
                placeholder="مثلاً مراقبت پوست"
              >

            </div>

          </div>


          <div class="field">

            <label>توضیحات محصول</label>

            <textarea
              oninput="updateProduct(${product.id}, 'description', this.value)"
              placeholder="توضیحات محصول را بنویسید..."
            >${escapeHtml(product.description || "")}</textarea>

          </div>


          <div class="product-actions">

            <button
              class="btn btn-danger"
              onclick="deleteProduct(${product.id})">
              🗑️ حذف محصول
            </button>

          </div>

        </section>

      `;

    }).join("");

  }


  /*
   ============================================================
   تغییر اطلاعات محصول
   ============================================================
  */

  function updateProduct(id, field, value) {

    const product = products.find(p => p.id === id);

    if (!product) return;

    product[field] = value;

  }


  function updateCategory(id, value) {

    const product = products.find(p => p.id === id);

    if (!product) return;

    product.category = value;


    const labels = {
      skin: "مراقبت پوست",
      hair: "مراقبت مو",
      perfume: "عطر",
      beauty: "آرایشی و بهداشتی",
      antiaging: "جوانساز"
    };

    product.categoryLabel = labels[value] || "";

    renderProducts();

  }


  /*
   ============================================================
   افزودن محصول جدید
   ============================================================
  */

  function addProduct() {

    const newId =
      products.length
      ? Math.max(...products.map(p => Number(p.id) || 0)) + 1
      : 1;


    const newProduct = {

      id: newId,

      brand: "",

      title: "محصول جدید",

      category: "skin",

      categoryLabel: "مراقبت پوست",

      description: "",

      price: 0,

      badge: "جدید",

      image: ""

    };


    products.push(newProduct);

    renderProducts();

    setTimeout(() => {

      const cards =
        document.querySelectorAll(".product-card");

      if (cards.length) {

        cards[cards.length - 1].scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }

    }, 100);


    showMessage("محصول جدید اضافه شد.");

  }


  /*
   ============================================================
   حذف محصول
   ============================================================
  */

  function deleteProduct(id) {

    const product = products.find(p => p.id === id);

    if (!product) return;


    const confirmed = confirm(
      "آیا از حذف این محصول مطمئن هستید؟"
    );


    if (!confirmed) return;


    products = products.filter(p => p.id !== id);

    renderProducts();

    showMessage("محصول حذف شد.");

  }


  /*
   ============================================================
   انتخاب عکس از گوشی
   ============================================================
  */

  function changeImage(event, id) {

    const file = event.target.files[0];

    if (!file) return;


    if (!file.type.startsWith("image/")) {

      alert("لطفاً یک فایل تصویری انتخاب کنید.");

      return;

    }


    const reader = new FileReader();


    reader.onload = function(e) {

      const imageData = e.target.result;


      const product =
        products.find(p => p.id === id);


      if (!product) return;


      product.image = imageData;


      const oldPreview =
        document.getElementById("preview-" + id);


      if (oldPreview) {

        if (oldPreview.tagName === "IMG") {

          oldPreview.src = imageData;

        } else {

          const img = document.createElement("img");

          img.id = "preview-" + id;

          img.className = "image-preview";

          img.src = imageData;

          img.alt = "تصویر محصول";

          oldPreview.replaceWith(img);

        }

      }

      showMessage("عکس محصول انتخاب شد.");

    };


    reader.readAsDataURL(file);

  }


  /*
   ============================================================
   ذخیره
   ============================================================
  */

  function saveProducts() {

    try {

      localStorage.setItem(
        "ador_products",
        JSON.stringify(products)
      );


      showMessage(
        "تغییرات با موفقیت در این مرورگر ذخیره شد."
      );

    } catch (error) {

      alert(
        "ذخیره انجام نشد. احتمالاً حجم عکس‌های انتخاب‌شده زیاد است."
      );

    }

  }


  /*
   ============================================================
   بازگردانی اطلاعات اولیه
   ============================================================
  */

  function resetProducts() {

    const confirmed = confirm(
      "همه تغییرات حذف می‌شوند و محصولات اولیه برمی‌گردند. ادامه می‌دهید؟"
    );


    if (!confirmed) return;


    products =
      JSON.parse(JSON.stringify(defaultProducts));


    localStorage.removeItem("ador_products");

    renderProducts();

    showMessage("اطلاعات اولیه بازگردانی شد.");

  }


  /*
   ============================================================
   پیام
   ============================================================
  */

  function showMessage(text) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.classList.add("show");


    setTimeout(() => {

      message.classList.remove("show");

    }, 2500);

  }


  /*
   ============================================================
   امنیت نمایش متن
   ============================================================
  */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }


  /*
   ============================================================
   شروع
   ============================================================
  */

  loadProducts();

</script>

</body>
</html>
